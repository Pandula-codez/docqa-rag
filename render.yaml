services:
  - type: web
    name: docqa-rag
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python -m src.ingest --data data --index index --embedding hash
    startCommand: gunicorn web:app --bind 0.0.0.0:$PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8